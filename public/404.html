<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found (404)</title>
  <style>
    body, html { background: #000; color: #fff; margin: 0; width: 100%; height: 100%; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    main { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 340px; text-align: center; }
    h1 { font-size: 72px; margin: 0 0 8px; letter-spacing: 6px; }
    p { font-size: 18px; margin: 0 0 24px; opacity: 0.85; }
    a { color: #1edd88; text-decoration: none; font-weight: 600; }
    a:hover { text-decoration: underline; }
    small { display: block; margin-top: 32px; opacity: 0.5; letter-spacing: 2px; }
  </style>
</head>
<body>
  <main>
    <h1>404</h1>
    <p>The page you seek is not here.</p>
    <a href="/">Take me home</a>
    <small>CATCHING.APP</small>
  </main>
</body>
</html>
