# Application translations. Devise and Simple Form keep their own files here.
en:
  meta:
    title: We have some catching app to do!
    description: Find a time that works for everyone, shown in everyone's own time zone. No sign-up needed.
  activerecord:
    attributes:
      event:
        # Three columns whose humanized names are not what any page calls
        # them. Naming them here is what makes a full message read as the
        # page does: "Link must be a web address…", not "Place url must be…".
        place_url: Link
        duration_minutes: Planned length
        slot_minutes: Slot length
      plan_item:
        duration_minutes: Length
    errors:
      models:
        event:
          attributes:
            duration_minutes:
              less_than_or_equal_to: must be at most 24 hours
        plan_item:
          attributes:
            duration_minutes:
              less_than_or_equal_to: must be at most 24 hours
  errors:
    messages:
      not_a_web_address: must be a web address starting with http:// or https://
      unknown_time_zone: is not a known time zone
