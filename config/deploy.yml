# Deployed with Kamal to hub, the Hetzner server shared with other apps
# (see AGENTS.md): the app behind kamal-proxy, which gets the Let's Encrypt
# certificate, and PostgreSQL beside it. Solid Queue runs inside Puma (see
# the Dockerfile). The deploy workflow runs bin/kamal deploy after CI passes
# on master.
service: catching-app
image: okturan/catching-app

# The box is shared, so every container has a ceiling.
servers:
  web:
    hosts:
      - 178.104.118.172
    options:
      memory: 1g
      cpus: 1

# Thruster serves the app on port 80 inside the container.
proxy:
  ssl: true
  hosts:
    - catching.app
    - www.catching.app
  app_port: 80
  healthcheck:
    path: /up

# GitHub's container registry. The deploy workflow signs in with its own
# token; from a laptop, KAMAL_REGISTRY_PASSWORD is a token that can write
# packages (see the README).
registry:
  server: ghcr.io
  username: okturan
  password:
    - KAMAL_REGISTRY_PASSWORD

# Built on the deploy workflow's x86 runner, never on the shared server.
builder:
  arch: amd64

env:
  clear:
    APP_HOST: catching.app
    MAILER_FROM: "Catching App <no-reply@catching.app>"
    # Resend's SMTP server. Without SMTP_ADDRESS the app would use OneSignal's
    # API instead, given ONESIGNAL_APP_ID and ONESIGNAL_API_KEY.
    SMTP_ADDRESS: smtp.resend.com
    SMTP_PORT: 587
    SMTP_USERNAME: resend
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    - SMTP_PASSWORD

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

accessories:
  db:
    image: postgres:17
    host: 178.104.118.172
    options:
      memory: 512m
      cpus: 0.5
    env:
      clear:
        POSTGRES_USER: catching_app
        POSTGRES_DB: catching_app_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - /srv/catching-app/postgres:/var/lib/postgresql/data
