# Deployed with Kamal to one Hetzner server: the app behind kamal-proxy,
# which gets the Let's Encrypt certificate, and PostgreSQL beside it. The
# deploy workflow runs bin/kamal deploy after CI passes on master. Solid Queue runs inside Puma (see the Dockerfile).
service: catching-app
image: okturan/catching-app

servers:
  web:
    - 178.104.14.208

# Thruster serves the app on port 80 inside the container.
proxy:
  ssl: true
  hosts:
    - catching.app
    - www.catching.app
  app_port: 80
  healthcheck:
    path: /up

# GitHub's container registry. The deploy workflow signs in with its own
# token; from a laptop, KAMAL_REGISTRY_PASSWORD is a token that can write
# packages (see the README).
registry:
  server: ghcr.io
  username: okturan
  password:
    - KAMAL_REGISTRY_PASSWORD

# The server builds its own x86 image; emulating x86 on an ARM Mac is slow
# and breaks the asset build.
builder:
  arch: amd64
  remote: ssh://root@178.104.14.208
  local: false

env:
  clear:
    APP_HOST: catching.app
    MAILER_FROM: "Catching App <no-reply@catching.app>"
    # Resend's SMTP server. Without SMTP_ADDRESS the app would use OneSignal's
    # API instead, given ONESIGNAL_APP_ID and ONESIGNAL_API_KEY.
    SMTP_ADDRESS: smtp.resend.com
    SMTP_PORT: 587
    SMTP_USERNAME: resend
  secret:
    - SECRET_KEY_BASE
    - DATABASE_URL
    - SMTP_PASSWORD

aliases:
  console: app exec --interactive --reuse "bin/rails console"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"

accessories:
  db:
    image: postgres:17
    host: 178.104.14.208
    env:
      clear:
        POSTGRES_USER: catching_app
        POSTGRES_DB: catching_app_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
